name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-status-app:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag devops-status-app:${{ github.sha }} ghcr.io/kalebas21/devops-status-app:${{ github.sha }}
          docker tag devops-status-app:${{ github.sha }} ghcr.io/kalebas21/devops-status-app:latest

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/kalebas21/devops-status-app:${{ github.sha }}
          docker push ghcr.io/kalebas21/devops-status-app:latest